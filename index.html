<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام الحضور والانصراف</title><style>body{font-family:Arial,Tahoma;background:#f4f6f8;margin:0}.wrap{max-width:760px;margin:auto;padding:15px}.card{background:#fff;padding:20px;margin:12px 0;border-radius:15px}h1,h2{text-align:center}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:8px;border:1px solid #ddd;font-size:16px}button{background:#2563eb;color:#fff;border:0;font-weight:bold}.in{background:#16803c}.out{background:#c62828}.gray{background:#64748b}.hidden{display:none}.msg{text-align:center;font-weight:bold;padding:8px}.err{color:#c62828}.ok{color:#16803c}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #ddd;text-align:center;font-size:13px}</style></head><body><div class="wrap"><div class="card"><h1>🏢 نظام الحضور والانصراف</h1><div id="clock" style="text-align:center;font-weight:bold"></div><p style="text-align:center">العمل 8 صباحًا - 6 مساءً | الجمعة إجازة</p></div><div class="card" id="login"><h2>الموظف</h2><select id="sel"><option value="">اختر اسمك</option></select><button onclick="choose()">متابعة</button><hr><input id="name" placeholder="أدخل اسمك لأول مرة"><button class="gray" onclick="add()">تسجيل الاسم لأول مرة</button><div id="m1" class="msg"></div></div><div class="card hidden" id="actions"><h2 id="welcome"></h2><button class="in" onclick="record('check_in','حضور')">🟢 تسجيل حضور</button><button class="out" onclick="record('check_out','انصراف')">🔴 تسجيل انصراف</button><button class="gray" onclick="logout()">تغيير الموظف</button><div id="m2" class="msg"></div></div><div class="card"><h2>السجل</h2><div style="overflow:auto"><table><thead><tr><th>الاسم</th><th>التاريخ</th><th>حضور</th><th>انصراف</th><th>فعلي</th><th>إضافي</th><th>نقص</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://yynjyblmozkcpbjcfiya.supabase.co";
const SUPABASE_KEY="sb_publishable_89D31QzoYft9btrmFJZJOQ_UiHNnRUO";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let current=null;
const $=x=>document.getElementById(x),msg=(x,t,c='ok')=>{$(x).textContent=t;$(x).className='msg '+c},pad=x=>String(x).padStart(2,'0');
setInterval(()=>{$('clock').textContent=new Date().toLocaleString('ar-EG')},1000);
function date(){let d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nowISO(){return new Date().toISOString()}
function displayTime(v){if(!v)return '-';let d=new Date(v);return Number.isNaN(d.getTime())?'-':pad(d.getHours())+':'+pad(d.getMinutes())}
function min(v){if(!v)return null;let d=new Date(v);return Number.isNaN(d.getTime())?null:d.getHours()*60+d.getMinutes()}
function fmt(m){m=Math.max(0,m||0);return Math.floor(m/60)+'س '+m%60+'د'}
async function loadEmployees(){let{data,error}=await db.from('employees').select('id,name').order('name');if(error)return msg('m1','خطأ: '+error.message,'err');$('sel').innerHTML='<option value="">اختر اسمك</option>'+data.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}
async function add(){let name=$('name').value.trim();if(!name)return msg('m1','اكتب الاسم','err');let{data,error}=await db.from('employees').insert({name}).select().single();if(error){let q=await db.from('employees').select('*').ilike('name',name).limit(1);if(q.data?.[0]){current=q.data[0];await loadEmployees();return start('الاسم مسجل بالفعل')}return msg('m1','خطأ: '+error.message,'err')}current=data;await loadEmployees();$('name').value='';start('تم تسجيل الاسم بنجاح')}
function choose(){let id=$('sel').value;if(!id)return msg('m1','اختر اسمك','err');current={id:+id,name:$('sel').selectedOptions[0].text};start()}
function start(t=''){$('login').classList.add('hidden');$('actions').classList.remove('hidden');$('welcome').textContent='مرحبًا '+current.name;if(t)msg('m2',t);localStorage.setItem('att_emp',JSON.stringify(current))}
function logout(){current=null;localStorage.removeItem('att_emp');$('actions').classList.add('hidden');$('login').classList.remove('hidden')}
async function record(field,label){let work_date=date(),{data:r,error:e}=await db.from('attendance').select('*').eq('employee_id',current.id).eq('work_date',work_date).maybeSingle();if(e)return msg('m2',e.message,'err');if(r?.[field])return msg('m2','تم التسجيل مسبقًا','err');let value=nowISO(),error;if(r)error=(await db.from('attendance').update({[field]:value}).eq('id',r.id)).error;else error=(await db.from('attendance').insert({employee_id:current.id,work_date,[field]:value})).error;if(error)return msg('m2',error.message,'err');msg('m2','تم تسجيل '+label+' الساعة '+displayTime(value));loadRows()}
async function loadRows(){let{data,error}=await db.from('attendance').select('work_date,check_in,check_out,employees(name)').order('work_date',{ascending:false}).limit(100);if(error)return;$('rows').innerHTML=data.map(r=>{let fri=new Date(r.work_date+'T12:00:00').getDay()===5,inMin=min(r.check_in),outMin=min(r.check_out),actual=inMin!==null&&outMin!==null?fmt(outMin-inMin):'-',extra=fri?0:(outMin!==null?Math.max(0,outMin-1080):0),lack=fri?0:(inMin!==null?Math.max(0,inMin-480):0)+(outMin!==null?Math.max(0,1080-outMin):0);return `<tr><td>${r.employees?.name||''}</td><td>${r.work_date}</td><td>${displayTime(r.check_in)}</td><td>${displayTime(r.check_out)}</td><td>${actual}</td><td>${fmt(extra)}</td><td>${fmt(lack)}</td></tr>`}).join('')}
(async()=>{await loadEmployees();await loadRows();try{current=JSON.parse(localStorage.getItem('att_emp'));if(current)start()}catch(e){}})();
</script></body></html>
